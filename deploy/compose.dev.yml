# 用途：启动本机开发用 PostgreSQL 与 Redis，并提供健康检查和持久化数据卷。
name: metergate-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: metergate
      POSTGRES_PASSWORD: metergate_dev_only
      POSTGRES_DB: metergate
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  migrate:
    profiles: ["workers"]
    build: &worker_build
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment: &worker_env
      MG_DATABASE_URL: postgresql+asyncpg://metergate:metergate_dev_only@postgres:5432/metergate
      MG_REDIS_URL: redis://redis:6379/0
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  outbox:
    profiles: ["workers"]
    build: *worker_build
    environment: *worker_env
    command: ["python", "-m", "app.workers.dispatch"]
    restart: unless-stopped
    depends_on: &worker_dependencies
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    profiles: ["workers"]
    build: *worker_build
    environment: *worker_env
    command: ["dramatiq", "app.workers.tasks:broker", "--processes", "1", "--threads", "4"]
    restart: unless-stopped
    depends_on: *worker_dependencies

volumes:
  postgres_data:
  redis_data:
