# 用途：启动本机开发用 PostgreSQL 与 Redis，并提供健康检查和持久化数据卷。
name: metergate-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: metergate
      POSTGRES_PASSWORD: metergate_dev_only
      POSTGRES_DB: metergate
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
